  <div class="tweet-content">
  当一个人已经处在情绪崩溃、生活压迫、社群攀比用药量的漩涡里时，任何底线性原则都显得像隔岸观火的风凉话。
  <br/>
  有效的干预必须绕过讲道理，直接作用于情绪和身体感受。也就是说，我们可能需要一批不说话、不评判，只是陪伴和倾听，在对方需要时才给出自己深思熟虑后的建议。
  <br/>
  除此之外，因为药物滥用往往是孤立的症状，而非病根。社群内其实也有可能建立起一种不以用药量论英雄、不传播讣告作为悲剧美学的新社交模式。而不只是现在的只能靠讣告、紧急求救出圈。
