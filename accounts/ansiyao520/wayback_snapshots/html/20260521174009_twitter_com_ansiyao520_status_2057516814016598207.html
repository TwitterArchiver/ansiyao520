  在我上高中的时候。想死了想离家出走想骑到自己死去。我骑着电动车在自己熟悉的购物街。因为我知道一旦走向陌生的街道，就无法回头了。我一直犹豫，要不要走向自己的死亡。我万念俱灰地鼓起嘴又松开逗自己玩。可是当我的目光汇聚。

  <br/>
