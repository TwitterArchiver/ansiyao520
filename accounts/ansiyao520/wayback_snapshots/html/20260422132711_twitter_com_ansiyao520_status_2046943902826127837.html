  我和大家一个很不同的点是。我对聚众行为完全没有感觉。
  <br/>
  无论是任何喜欢的东西，我都不喜欢参加聚众庆祝。比如tho、thp。或者其他所谓漫展。
  <br/>

  <br/>
  不愿意去公共场合，也不愿意面对身边有很多相同爱好的人这一事实。
  <br/>
  漫展是一个商业行为，我不想把我的爱好，和商业聚会绑定起来。
  <br/>
  而且，漫展散场后，更是失落无比吧。明明身边有那么多同好，却是毫无力量呢。
  <br/>
  所以我非常讨厌漫展，非常讨厌同好聚会。
