  最近我阅读了大量雷锋同志的事迹。一方面，我被他毫不利己、一心奉献革命的精神所折服。另一方面，雷锋在日记里总是强调自己是被共产党拯救的，要为党的事业奉献一生——他对革命事业更多的是一种感恩之情——这也引起了我深深的思考。
