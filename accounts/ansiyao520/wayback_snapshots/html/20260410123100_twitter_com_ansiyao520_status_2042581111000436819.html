  诗歌补档：
  <br/>
  《哭亡妹》
  <br/>
  安思瑶
  <br/>
  前日寻死语未稠，我犹迟计在心头。
  <br/>
  与君论策方寸乱，隔夜惊闻玉已休。
  <br/>
  去岁反目始八月，半载光阴竟成讴。
  <br/>
  初逢七日成永诀，从此人间怕回眸。
  <br/>
  <br/>
  最怜纯善招天妒，愈是娇颜命难留。
  <br/>
  守得音容唯一帧，忍看遗墨字字秋。
  <br/>
  生前寂寂唯我伴，殁后纷纷尽来诌。
  <br/>
  此痛锥心无解药，苍生大病在根由。
  <br/>
  <br/>
  哭汝不闻泉下骨，立尽中宵雪满头。
  <br/>
  天地为棺终有隙，独抱深悲作楚囚。
  <br/>
  愿化星斗常照汝，夜夜清辉满坟丘。
  <br/>
  若有轮回重见日，还续来生未了俦。
  <br/>
  <br/>
  肝肠寸断剜心肉，痛彻西风万古楼。
  <br/>
  从此人间添恨事，苍天无眼水倒流。
